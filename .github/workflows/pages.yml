name: 更新双彩数据并发布

on:
  push:
    branches: [main]
  schedule:
    # Beijing 19:17 / 19:32 / 19:47 / 20:07: pre-warm before actual 20:20 heat.
    # Multiple starts reduce schedule-delay risk; GitHub cron is not an SLA.
    - cron: "17,32,47 11 * * *"
    - cron: "7,20,30,40,50 12 * * *"
    # After capture: draw results and next-day base preparation.
    - cron: "7,27,47 14 * * *"
    - cron: "17 15,22,1,4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 自动选择晚间快速更新，或全量更新
        type: choice
        options: [auto, full]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 两彩同步更新（晚间只抓热度和生成矩阵）
        run: node scripts/update-daily.mjs --mode "${{ inputs.mode || 'auto' }}"
      - name: 核对两彩推荐、判中、遗漏与热度存档
        run: node --test tests/daily-update.test.mjs tests/matrix-history-audit.test.mjs tests/target-heat.test.mjs tests/matrix-reconstruction.test.mjs tests/matrix-kill3-dynamic.test.mjs tests/published-data-integrity.test.mjs tests/combination-omissions.test.mjs tests/pl3-data.test.mjs tests/position7-data.test.mjs tests/kill3-data.test.mjs tests/v9-low-hit.test.mjs tests/v9-2-low-hit.test.mjs tests/matrix22-data.test.mjs
      - name: 保存验证后的最新开奖和页面数据
        run: |
          if ! git diff --quiet -- scripts/data scripts/results pages public; then
            git config user.name "fc3d-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/data scripts/results pages public
            git commit -m "Update verified dual-game data and pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布双彩全部模块
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查新网站两彩期号与热度批次
        run: node scripts/check-daily-update.mjs --online
      - name: 更新失败说明
        if: failure()
        run: |
          echo "::error::双彩发布或同步检查失败，请检查本次运行日志；不得把历史回放补成真实前瞻。"
